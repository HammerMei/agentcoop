name: CI

on:
  push:
    branches: [main, feature/dynamic-watcher-implementation]
  pull_request:
    # The dynamic-watcher work lands as ~14 increments that each PR into the
    # integration branch rather than main, so without it listed here every one
    # of those PRs would merge with no CI at all and the whole phase would only
    # be verified once, in the final PR to main -- the single flag-day the
    # increments exist to avoid.
    branches: [main, feature/dynamic-watcher-implementation]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint (ruff)
        run: uv run ruff check gateway/ tests/ tools/

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short -m "not e2e"
