# Spec section 6.2 where the owner, not the orchestrator, mutes: chair collects one idea
# each; at 75s H mutes the authors and sends critic in. critic starts on H's mention (a
# human mention wakes a muted bot); its challenge to the author is a bot mention of a
# muted bot, which mute holds (enforce on) or counts (off). No bot can lift H's mute by
# accident: chair may, but is not asked to.
name: brainstorm_owner_mute
room: team
members:
  - {username: H, role: owner}
  - {username: chair, role: bot, display_name: Chair, profile: "runs structured meetings; collects and synthesises"}
  - {username: a, role: bot, profile: "backend engineer"}
  - {username: b, role: bot, profile: "frontend engineer"}
  - {username: c, role: bot, profile: "product"}
  - {username: critic, role: bot, profile: "critic; finds the weak point in every idea and asks its author directly to defend it"}
params: {rate_limit_posts: 6, rate_limit_words: 600, rate_limit_seconds: 300, sweep_interval_seconds: 30}
events:
  - {at: 0, human: H, text: "orchestrator: @chair"}
  - {at: 1, human: H, text: "@chair run a short brainstorm on how to cut the build time: one idea each from a, b and c, then summarise for me"}
  - {at: 75, human: H, text: "mute: @a @b @c"}
  - {at: 76, human: H, text: "@critic pick the weakest of the three ideas and challenge its author directly"}
bots:
  chair:
    - {source: addressed, once: true, reply: {replies: [{to: [a, b, c], text: "one post each with your best idea; address only me."}]}}
    - {thread: main, reply: {replies: [{done: true}]}}
  a:
    - {source: addressed, once: true, reply: {replies: [{to: [chair], text: "cache the dependency layer"}]}}
    - {when_from: critic, once: true, reply: {replies: [{to: [critic], text: "a cache is a stopgap, but it is the cheapest 30% we will get"}]}}
  b:
    - {source: addressed, once: true, reply: {replies: [{to: [chair], text: "split the test suite into shards"}]}}
  c:
    - {source: addressed, once: true, reply: {replies: [{to: [chair], text: "drop the e2e suite from PR builds"}]}}
  critic:
    - {source: addressed, once: true, reply: {replies: [{to: [a], text: "@a caching hides the real problem. Defend it."}]}}
    - {thread: main, reply: {replies: [{done: true}]}}
horizon: 180
