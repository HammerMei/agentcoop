[project]
name = "agentcoop"
version = "1.0.0"
description = "Daemon that bridges chat platforms (Rocket.Chat and more) to AI agent backends (Claude, OpenCode)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
    { name = "HammerMei", url = "https://github.com/HammerMei" },
]
keywords = ["ai", "agent", "chat", "rocketchat", "claude", "opencode", "gateway", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "websockets>=14.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-bash>=0.23.0",
    "croniter>=2.0.0",
    "textual>=8.2.0",
]

[project.urls]
Homepage = "https://github.com/HammerMei/agentcoop"
Repository = "https://github.com/HammerMei/agentcoop"
Issues = "https://github.com/HammerMei/agentcoop/issues"
Changelog = "https://github.com/HammerMei/agentcoop/releases"

[project.scripts]
coop = "gateway.cli:main"
coop-provision = "gateway.admin.cli:main"
gateway-tui = "gateway.tools.tui:main"
# Not an alias: prints why the old name no longer works and exits 1 (#154).
agent-chat-gateway = "gateway.tombstone:main"

[tool.hatch.build.targets.wheel]
packages = ["gateway"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "coverage>=7.13.5",
    "jsonschema>=4.23.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.3",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: multi-component tests with real I/O or multiple subsystems",
    "e2e: end-to-end tests requiring Docker + ANTHROPIC_API_KEY (run via make e2e-test)",
    # Documented in tests/e2e/test_schedule_e2e.py's own module docstring as
    # the way to skip the scheduler tests (`-m "not slow"`), which cannot cost
    # less than a minute each because the scheduler ticks every 60s. It was
    # never registered, so the documented switch emitted an
    # PytestUnknownMarkWarning on every run and would fail outright under
    # --strict-markers.
    "slow: takes a minute or more by construction (e.g. waits on a scheduler tick)",
]

[tool.coverage.run]
source = ["gateway"]
# Branch coverage, not just line coverage. A line-only number counts an `if`
# whose false arm nothing exercises as fully covered, which is exactly the kind
# of gap this project keeps finding one regression at a time.
branch = true

[tool.coverage.report]
exclude_also = [
    # Standard pragma
    "pragma: no cover",
]
omit = [
    # TUI is a Rich/terminal interactive tool — not unit-testable without a
    # real terminal.  Excluded from coverage to avoid skewing the numbers.
    "gateway/tools/tui.py",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C901"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
# The `cheap` gate's limit (docs/agents/finding-triage.md): a review fix that pushes a
# function past this is not cheap, it is scored. C901 is the CI backstop for the gate.
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Ratchet, 2026-10-07: files that already had a function over 10 when C901 was enabled.
# Remove a file once its last over-limit function is brought down; never add one.
"gateway/admin/cli.py" = ["C901"]
"gateway/admin/config.py" = ["C901"]
"gateway/agents/claude/adapter.py" = ["C901"]
"gateway/agents/opencode/adapter.py" = ["C901"]
"gateway/agents/opencode/broker.py" = ["C901"]
"gateway/agents/opencode/skills/daily-briefing/runner.py" = ["C901"]
"gateway/cli.py" = ["C901"]
"gateway/config.py" = ["C901"]
"gateway/config_edit.py" = ["C901"]
