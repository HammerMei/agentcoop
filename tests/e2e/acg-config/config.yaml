connectors:
- name: rc-e2e
  type: rocketchat
  server:
    url: http://rocketchat:3100
    username: acg_bot
    password: acg_bot_e2e_2024
  allowed_users:
    owners:
    - test_user
    guests: []
  attachments:
    max_file_size_mb: 10
    download_timeout: 30
  reply_in_thread: false
  permission_reply_in_thread: false
  context_inject_files: []
# One AgentCoop, one connector per platform. `server.url` uses the compose service
# name because this resolves from INSIDE the container; the host-side test
# clients use localhost:8065.
- name: mm-e2e
  type: mattermost
  server:
    url: http://mattermost:8065
    team: acg-e2e
    username: acg_bot
    password: acg_bot_e2e_2024
  allowed_users:
    owners:
    - test_user
    guests: []
  # Only ONE override here, so it is worth saying which and why: both
  # connectors default permission_reply_in_thread to true, so this has to be
  # pinned for a reply to land in the channel the test polls. Everything else
  # (attachments, reply_in_thread) takes the connector default deliberately —
  # restating a default disguises which line is doing the work.
  permission_reply_in_thread: false
agent_templates:
  e2e-default:
    new_session_args: []
    context_inject_files: []
    working_directory: /root/.agentcoop/work
    guest_allowed_tools: []
    timeout: 180
    permissions:
      enabled: true
      timeout: 60
      skip_owner_approval: false
agents:
  e2e-opencode:
    inherits: e2e-default
    type: opencode
    command: opencode
    session_prefix: e2e-oc
    owner_allowed_tools:
    - tool: read
    - tool: glob
    - tool: grep
    - tool: write
    - tool: external_directory
    - tool: bash
  e2e-claude:
    inherits: e2e-default
    type: claude
    command: claude
    session_prefix: e2e-cc
    owner_allowed_tools:
    - tool: Read
    - tool: Glob
    - tool: Grep
    - tool: Write
    - tool: Bash
  e2e-claude-permission:
    inherits: e2e-default
    type: claude
    command: claude
    session_prefix: e2e-perm
  e2e-opencode-permission:
    inherits: e2e-default
    type: opencode
    command: opencode
    session_prefix: e2e-oc-perm
watcher_templates:
  e2e-default:
    connector: rc-e2e
    context_inject_files: []
  e2e-mm-default:
    connector: mm-e2e
    context_inject_files: []
watcher_rules:
- name: e2e-dm
  inherits: e2e-default
  rooms:
    direct: true
  agent: e2e-opencode
- name: e2e-claude-channel
  inherits: e2e-default
  rooms:
    include:
    - acg-e2e-claude
  agent: e2e-claude
- name: e2e-permission
  inherits: e2e-default
  rooms:
    include:
    - acg-e2e-permission
  agent: e2e-claude-permission
- name: e2e-opencode-permission
  inherits: e2e-default
  rooms:
    include:
    - acg-e2e-opencode-permission
  agent: e2e-opencode-permission
# ── Mattermost ────────────────────────────────────────────────────────────────
# Both MM rules use the Claude agent: the MM coverage is a focused smoke plus
# the one behaviour only E2E can show, and pointing a rule at OpenCode would
# add its ~60s cold start for nothing.
- name: e2e-mm-dm
  inherits: e2e-mm-default
  rooms:
    direct: true
  agent: e2e-claude
- name: e2e-mm-channel
  inherits: e2e-mm-default
  rooms:
    # The glob DELIBERATELY matches acg-e2e-mm-outside as well as
    # acg-e2e-mm-claude. The bot can read that channel but is not a member of
    # it, and design §6.2 is that Mattermost delivers no event at all for such
    # a channel — so the only thing preventing a reply there is the absence of
    # an event, not the rule declining to match.
    #
    # Narrowing this glob to the member channel would make
    # test_mm_membership_delivery.py pass for the wrong reason, and silently.
    include:
    - acg-e2e-mm-*
  agent: e2e-claude
