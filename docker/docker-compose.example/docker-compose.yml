# =============================================================================
# AgentCoop Docker Compose — example based on docker_env/ layout
#
# INTERNAL TESTING ONLY. This setup exists for AgentCoop's E2E/CI runs and is
# not a supported production install — use install.sh on the host instead.
#
# Directory structure:
#   your-deploy-dir/
#   ├── docker-compose.yml        (this file, renamed)
#   ├── .env                      (secrets — never commit this)
#   ├── config/
#   │   └── config.yaml           (gateway config — RC credentials go directly in it)
#   ├── agents/                   (agent working directories, auto-created)
#   │   ├── claude_agent/
#   │   └── opencode_agent/
#   ├── contexts/                 (context files, defaults restored if empty)
#   └── data/                     (persistent runtime state, survives upgrades)
#       └── jobs.json             (scheduled jobs)
#
# Setup (one-time):
#   1. Copy this directory to your deployment location
#   2. vim .env                                      # fill in CLAUDE_CODE_OAUTH_TOKEN
#   3. vim config/config.yaml                        # fill in RC credentials, owners, rooms, agents
#
# Optional — customize agent personas/context per agent backend:
#   vim agents/claude_agent/CLAUDE.md                # Claude Code agent persona & instructions
#   vim agents/opencode_agent/AGENTS.md              # OpenCode agent persona & instructions
#
# Start:   docker compose up -d
# Logs:    docker compose logs -f
# Stop:    docker compose down
# =============================================================================

services:
  coop:
    image: ghcr.io/hammermei/agentcoop:latest
    container_name: coop
    restart: unless-stopped

    volumes:
      # ── AgentCoop config ────────────────────────────────────────────────────────
      # config.yaml (RC credentials go directly in it — chmod 600) —
      # symlinked into runtime dir
      - ./config:/root/.agentcoop/config

      # ── Agent working directories ─────────────────────────────────────────
      # Files created by agents are visible locally under ./agents/
      - ./agents:/root/.agentcoop/work

      # ── Context files ─────────────────────────────────────────────────────
      # Injected into every agent session. Defaults restored if empty.
      - ./contexts:/root/.agentcoop/contexts

      # ── Persistent runtime data ───────────────────────────────────────────
      # Survives container recreates (upgrades). Currently holds jobs.json
      # for scheduled jobs; add future persistent files here too.
      # Directory mount avoids the EBUSY issue of single-file bind-mounts.
      - ./data:/root/.agentcoop/data

      # ── OpenCode config (uncomment if using OpenCode backend) ─────────────
      # - ${HOME}/.config/opencode:/root/.config/opencode

    environment:
      # ── Claude Code auth (pick one) ───────────────────────────────────────
      # Option A (recommended): OAuth token — Claude.ai subscription,
      #   supports context management, no ~/.claude mount needed.
      #   Set CLAUDE_CODE_OAUTH_TOKEN in .env file (never hardcode here).
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}

      # Option B: direct Anthropic API key
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
