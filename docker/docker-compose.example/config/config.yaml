# coop config — Docker example
# Based on docker_env/config/config.yaml
#
# Place this file at: ./config/config.yaml
# Fill in your Rocket.Chat credentials below directly — this file gets
# chmod 600 automatically (both by the config TUI and this Docker image's
# entrypoint), so plaintext here is fine; just don't commit your filled-in
# copy to version control (docker/docker-compose.example/.gitignore excepts
# THIS placeholder file only, on purpose).

connectors:
  - name: rocketchat
    type: rocketchat
    server:
      url: "http://rocketchat:3000"  # your Rocket.Chat server URL
      username: "mybot"              # your bot's username
      password: "changeme"           # your bot's password
    allowed_users:
      owners:
        - your-username        # change to your RC username
      guests: []
    attachments:
      max_file_size_mb: 10
      download_timeout: 30
    reply_in_thread: false
    permission_reply_in_thread: true
    context_inject_files:
      - /root/.agentcoop/contexts/rc-gateway-context.md

agents:
  # ── Claude Code backend ──────────────────────────────────────────────────
  claude_agent:
    type: claude
    command: claude
    new_session_args: []
    session_prefix: agent-chat
    context_inject_files: []
    working_directory: /root/.agentcoop/work/claude_agent
    owner_allowed_tools:
      - tool: "Read"
      - tool: "Glob"
      - tool: "Grep"
      - tool: "WebSearch"
      - tool: "WebFetch"
        params: "https?://.*"
      - tool: "Bash"
        params: "git (log|diff|status|show)( .*)?"
      - tool: "Bash"
        params: "coop\\s+send\\s+.*"
    guest_allowed_tools:
      - tool: "Read"
      - tool: "Grep"
      - tool: "Glob"
      - tool: "WebSearch"
      - tool: "WebFetch"
        params: "https?://.*"
      - tool: "Bash"
        params: "coop\\s+send\\s+.*"
    timeout: 360
    permissions:
      enabled: true
      timeout: 300
      skip_owner_approval: false

  # ── OpenCode backend ─────────────────────────────────────────────────────
  opencode_agent:
    type: opencode
    command: opencode
    new_session_args: []
    session_prefix: agent-chat
    context_inject_files: []
    working_directory: /root/.agentcoop/work/opencode_agent
    owner_allowed_tools:
      - tool: "read"           # opencode uses lowercase tool names
      - tool: "glob"
      - tool: "grep"
      - tool: "websearch"
      - tool: "webfetch"
        params: "https?://.*"
      - tool: "bash"
        params: "git (log|diff|status|show)( .*)?"
      - tool: "bash"
        params: "coop\\s+send\\s+.*"
    guest_allowed_tools:
      - tool: "read"
      - tool: "grep"
      - tool: "glob"
      - tool: "websearch"
      - tool: "webfetch"
        params: "https?://.*"
      - tool: "bash"
        params: "coop\\s+send\\s+.*"
    timeout: 360
    permissions:
      enabled: true
      timeout: 300

watcher_rules:
  # DM rule — OpenCode agent. DMs have no room name for a pattern to match,
  # so `direct: true` is how a rule claims 1:1 direct messages.
  - name: dm
    connector: rocketchat
    rooms:
      direct: true
    agent: opencode_agent
    context_inject_files: []

  # Channel rule — Claude agent. The watcher is created on the room's first
  # message and shows up in `coop list` as "rocketchat:general".
  - name: room
    connector: rocketchat
    rooms:
      include: [general]       # channel name(s); globs like "eng-*" work too
    agent: claude_agent
    context_inject_files: []
